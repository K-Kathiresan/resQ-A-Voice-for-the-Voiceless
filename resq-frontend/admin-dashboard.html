<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>resQ Admin Dashboard</title>

    <link rel="stylesheet" href="./css/admin-dashboard.css">
</head>
<body>

    <header class="navbar">
        <h1>resQ Admin Dashboard</h1>

        <button id="logoutBtn">Logout</button>
    </header>

    <main class="container">

        <div class="hero-card">

            <h1>Rescue Operations Center</h1>

            <p>
                Monitor rescue requests, assign volunteers,
                and track rescue outcomes across the platform.
            </p>

        </div>

        <div class="stats-grid">

            <div class="stat-card">
                <h2 id="pendingCount">0</h2>
                <p>Pending</p>
            </div>

            <div class="stat-card">
                <h2 id="assignedCount">0</h2>
                <p>Assigned</p>
            </div>

            <div class="stat-card">
                <h2 id="rescuedCount">0</h2>
                <p>Rescued</p>
            </div>

            <div class="stat-card">
                <h2 id="failedCount">0</h2>
                <p>Failed</p>
            </div>

        </div>

        <section class="reports-section">
            <h2>All Rescue Reports</h2>

            <div id="reportsContainer" class="reports-container">
            </div>

        </section>

    </main>


    <div id="reportModal" class="modal">

    <div class="modal-content">

        <span id="closeModal">&times;</span>

        <div id="modalBody"></div>

    </div>

</div>

<script src="./js/admin-dashboard.js"></script>
</body>
</html>
