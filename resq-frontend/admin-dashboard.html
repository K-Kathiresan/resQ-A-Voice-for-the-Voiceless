<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>resQ Admin Dashboard</title>

    <link rel="stylesheet" href="./css/admin-dashboard.css">
</head>
<body>

    <header class="navbar">
        <h1>resQ Admin Dashboard</h1>

        <button id="logoutBtn">
            Logout
        </button>
    </header>

    <main class="container">

        <!-- Hero Section -->

        <div class="hero-card">

            <h1>Rescue Operations Center</h1>

            <p>
                Monitor rescue requests, assign volunteers,
                and track rescue outcomes across the platform.
            </p>

        </div>

        <!-- Statistics Cards -->

        <div class="stats-grid">

            <div class="stat-card">
                <h2 id="totalReports">0</h2>
                <p>Total Reports</p>
            </div>

            <div class="stat-card">
                <h2 id="activeCases">0</h2>
                <p>Active Cases</p>
            </div>

            <div class="stat-card">
                <h2 id="closedCases">0</h2>
                <p>Closed Cases</p>
            </div>

            <div class="stat-card">
                <h2 id="successRate">0%</h2>
                <p>Success Rate</p>
            </div>

        </div>

        <!-- Reports Section -->

        <section class="reports-section">

            <h2>All Rescue Reports</h2>

            <div class="filters-section">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search animal type..."
                >

                <select id="statusFilter">

                    <option value="ALL">All Status</option>

                    <option value="PENDING">Pending</option>

                    <option value="ASSIGNED">Assigned</option>

                    <option value="ON_THE_WAY">On The Way</option>

                    <option value="RESCUING">Rescuing</option>

                    <option value="RESCUED">Rescued</option>

                    <option value="FAILED">Failed</option>

                </select>

            </div>

            <div
                id="reportsContainer"
                class="reports-container"
            >
            </div>

        </section>

    </main>

    <!-- Report Details Modal -->

    <div id="reportModal" class="modal">

        <div class="modal-content">

            <span id="closeModal">
                &times;
            </span>

            <div id="modalBody">
            </div>

        </div>

    </div>

    <script src="./js/admin-dashboard.js"></script>

</body>
</html>
