<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Volunteer Dashboard</title>

<link rel="stylesheet" href="css/volunteer-dashboard.css">

</head>

<body>

<nav>

    <h2>resQ Volunteer Dashboard</h2>

    <button id="logoutBtn">
        Logout
    </button>

</nav>

<main>

    <section class="hero-card">

        <h1>
            Volunteer Rescue Operations
        </h1>

        <p>
            Manage assigned rescue cases,
            navigate to rescue locations
            and update rescue outcomes.
        </p>

    </section>

    <div class="stats-grid">

        <div class="stat-card">

            <h2 id="assignedCount">0</h2>

            <p>Assigned Cases</p>

        </div>

        <div class="stat-card">

            <h2 id="activeCount">0</h2>

            <p>Active Cases</p>

        </div>

        <div class="stat-card">

            <h2 id="completedCount">0</h2>

            <p>Completed Cases</p>

        </div>

    </div>

    <section>

        <h2>Assigned Reports</h2>

        <div id="assignedReportsContainer"></div>

    </section>

</main>

<script src="js/volunteer-dashboard.js"></script>


</body>

</html>
