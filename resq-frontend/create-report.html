<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Report</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <h1>Create Animal Rescue Report</h1>

    <form id="reportForm">

        <input
                type="text"
                id="animalType"
                placeholder="Enter Animal Type"
                required
        >

        <textarea
                id="description"
                placeholder="Describe Animal Condition"
                required
        ></textarea>

        <input
        type="text"
        id="location"
        placeholder="Enter Location"
        required
        >

        <button
                type="button"
                id="getLocationBtn"
        >
            Use Current Location
        </button>

        <button
            type="button"
            id="openCameraBtn"
        >
            Open Camera
        </button>

        <video
            id="cameraPreview"
            autoplay
            playsinline
            style="display:none; width:100%; margin-top:10px;"
        ></video>

        <button
            type="button"
            id="captureBtn"
            style="display:none;"
        >
            Capture Photo
        </button>

        <canvas
            id="photoCanvas"
            style="display:none;"
        ></canvas>

        <input
            type="file"
            id="img"
            accept="image/*"
            capture="environment"
            required
>

        <button type="submit">
            Submit Report
        </button>

    </form>

</div>

<script src="js/api.js"></script>

<script src="js/create-report.js"></script>

</body>

</html>
