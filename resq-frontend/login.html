<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>resQ Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <h1>Login</h1>

    <form id="loginForm">

        <input
                type="email"
                id="email"
                placeholder="Enter Email"
                required
        >

        <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

<script src="js/api.js"></script>

<script src="js/login.js"></script>

</body>

</html>
